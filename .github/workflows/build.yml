name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Build debug APK
        shell: bash
        run: |
          set +e
          gradle -p MS_Screen_Reader_v1-43 assembleDebug --stacktrace 2>&1 | tee build_output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -iE "error|exception|FAILURE|Could not|^e: " build_output.log | tail -n 40 > errors_only.log || true
            if [ -s errors_only.log ]; then
              while IFS= read -r line; do
                escaped=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g')
                echo "::error::$escaped"
              done < errors_only.log
            else
              echo "::error::Build failed with exit code $status but no obvious error line was found in the output — the full log will be needed."
            fi
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: MS_Screen_Reader_v1-43/app/build/outputs/apk/debug/*.apk
